  player_not_punished: "<gold><player>은(는) 처벌을 받지 않았습니다.</gold>"
  cannot-report-self: "<red>자기 자신을 신고할 수 없습니다!</red>"
  ip_not_found: "<gold> <ip> IP를 가진 플레이어를 찾을 수 없습니다.</gold>"
  no_data: "<red>표시할 내용이 없습니다.</red>"
  db_error: "처벌 내용을 데이터베이스에 저장하는 중 오류가 발생했습니다. 대안을 사용합니다. 콘솔을 확인해 주세요!"
