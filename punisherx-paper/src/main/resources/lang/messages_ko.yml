  usage: "올바른 사용법: <gold>/jail <player_name> (시간) <사유></gold>"
  jail_message: "<red>당신은 <b><reason></b> 의 사유로 <b><time></b></red> 동안 감옥에 수감되었습니다."
  teleport_failed: "<red>호송이 취소되었습니다: 설정된 감옥 위치가 안전하지 않은 위치입니다!</red>"
  mute_info_message: "<red>당신이 메시지를 보내도 아무도 듣지 못합니다.</red>"
  command_blocked_message: "<red>감옥에 수감 중인 동안은 명령어를 사용할 수 없습니다!</red>"
  jail_restrict_message: "탈옥은 금지되어 있습니다. 감옥으로 다시 호송되었습니다."
  broadcast: "<dark_gray><gray><player></gray>이(가) <gray><reason></gray>의 사유로 <gray><time></gray></dark_gray> 동안 감옥에 수감되었습니다."
  # Alternatively, you can use the following message format if you want to highlight this message more
  # broadcast:
  #   - "<dark_gray>*************** Your Server Name *************** </dark_gray>"
  #   - ""
  #   - "<red>   Player <white><player></white> was jailed</red>"
  #   - "   Reason: <white><reason></white>"
  #   - "   Duration: <white><time></white>"
  #   - ""
  #   - "<dark_gray>*************************************************** </dark_gray>"
  log: "<dark_gray>수감자 <gray><player></gray>이(가) 감옥에서 <gray><message></gray></dark_gray>라고 보냈습니다."
  no_reasons: "사유 없음"
