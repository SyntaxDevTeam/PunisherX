  history-title: "<gold>신고 기록 — <page>페이지</gold>"
  empty: "<gray>이 페이지에는 신고가 없습니다.</gray>"
  details-title: "<gold>신고 #<id></gold>"
  not-found: "<red>신고를 찾을 수 없습니다.</red>"
  already-closed: "<yellow>이 신고는 이미 처리되었습니다.</yellow>"
  handled: "<green>신고 #<id>을(를) 처리했습니다. 결정과 사유가 저장되었습니다.</green>"
  status-open: "<yellow>상태: 처리 대기</yellow>"
  status-resolved: "<green>상태: 승인됨</green>"
  status-rejected: "<red>상태: 거절됨</red>"
  usage: "올바른 사용법: <gold>/report <신고할 플레이어></gold>"
  cannot-report-self: "<red>자기 자신을 신고할 수는 없습니다!</red>"
  already-submitted: "<red>이미 처리되지 않은 신고가 있습니다. 새 신고를 보내려면 관리자가 기존 신고를 처리해야 합니다.</red>"
  already-reported-target: "<red>이 플레이어에 대해 이미 처리되지 않은 신고가 있습니다. 관리자가 처리할 때까지 기다려 주세요.</red>"
