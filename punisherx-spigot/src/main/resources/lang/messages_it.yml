# Ver. 1.0.0
# Formattazione dei messaggi:
# Puoi usare la formattazione MiniMessage o Legacy (Minecraft).
# Esempi di utilizzo di MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Non mescolare i formati nello stesso messaggio. Se usi Legacy, non aggiungere MiniMessage,
# altrimenti verrà applicato solo quest’ultimo.

prefix: "<gradient:#2400ff:#5555ff:#55adff:#000caa>[<b>PunisherX</b>]</gradient>"

# Messaggi di errore
error:
  no_permission: "<red>Non hai il permesso per usare questo comando.</red>"
  player_not_found: "<gold>Nessun giocatore trovato con il nome <player>.</gold>"
  player_not_punished: "<gold>Il giocatore <player> non ha questa punizione.</gold>"
  ip_not_found: "<gold>Nessun giocatore trovato con l’IP <ip>.</gold>"
  no_data: "<red>Nessun dato da mostrare.</red>"
  db_error: "Si è verificato un errore durante l’aggiunta della punizione al database. Uso del metodo di riserva. Controlla la console!"
  db_not_ready: "<red>Il database è ancora in fase di avvio, riprova tra qualche secondo.</red>"
  console: "<red>Solo un giocatore può usare questo comando.</red>"
  reload: "<red>Si è verificato un errore durante il ricaricamento della configurazione:</red>"
  bypass: "<red><b>ATTENZIONE!</b> Il giocatore <gold><player></gold> non può essere punito a causa dei suoi permessi (OP o bypass).</red><newline><dark_gray>Forse si può aggirare...</dark_gray>"

# Messaggi del comando /setjail
setjail:
  usage: "Uso corretto: <gold>/setjail <raggio>"
  set: "<green>La posizione della prigione è stata impostata: <gold><world></gold> [<gold><locationx></gold>, <gold><locationy></gold>, <gold><locationz></gold>] con un raggio di <gold><radius></gold>"
  set_error: "<red>Impossibile impostare la posizione della prigione.</red>"
  invalid_radius: "<red>Inserisci un raggio valido (numero maggiore di 0).</red>"

# Messaggi del comando /setunjail
setunjail:
  usage: "Uso corretto: <gold>/setunjail</gold>"
  set: "<green>Il punto di spawn è stato impostato: <gold><world></gold> [<gold><locationx></gold>, <gold><locationy></gold>, <gold><locationz></gold>]</green>"
  set_error: "<red>Impossibile impostare il punto di spawn.</red>"

# Messaggi del comando /jail
jail:
  jail: "<green>Hai imprigionato il giocatore <gold><player></gold> per <gold><reason></gold> per <gold><time></gold></green> <dark_gray>(ID: <id>)</dark_gray>"
  usage: "Uso corretto: <gold>/jail <nome_giocatore> (tempo) <motivo>"
  jail_message: "<red>Sei stato imprigionato per <b><reason></b> per <b><time></b></red>"
  teleport_failed: "<red>Teleportation cancelled: the configured jail location is unsafe.</red>"
  mute_info_message: "<red>Stai cercando di parlare, ma dalla prigione nessuno ti sente...</red>"
  command_blocked_message: "<red>Non puoi usare comandi mentre stai scontando una pena in prigione.</red>"
  jail_restrict_message: "Lasciare l’area della prigione è vietato. Sei stato teletrasportato al punto assegnato."
  broadcast: "<dark_gray>Il giocatore <gray><player></gray> è stato imprigionato per <gray><reason></gray> per <gray><time></gray></dark_gray>"
  # In alternativa puoi usare questo formato se vuoi evidenziare di più il messaggio
  # broadcast:
  #   - "<dark_gray>*************** Nome del server *************** </dark_gray>"
  #   - ""
  #   - "<red>   Il giocatore <white><player></white> è stato imprigionato</red>"
  #   - "   Motivo: <white><reason></white>"
  #   - "   Durata: <white><time></white>"
  #   - ""
  #   - "<dark_gray>*************************************************** </dark_gray>"
  log: "<dark_gray>Il giocatore imprigionato <gray><player></gray> urla dalla sua cella: <gray><message></gray></dark_gray>"
  no_reasons: "nessun motivo"
  reasons:
    - "Pubblicità"
    - "Spam"
    - "Insulti"
    - "Linguaggio volgare"

# Messaggi del comando /unjail
unjail:
  unjail: "<green>Hai liberato il giocatore <gold><player></gold> dalla prigione</green>"
  usage: "Uso corretto: <gold>/unjail <nome_giocatore>"
  unjail_message: "<green>La tua pena in prigione è finita! Non sprecare questa occasione!</green>"
  teleport_failed: "<red>Teleportation cancelled: the configured spawn location is unsafe.</red>"
  success: "<green>Il giocatore <gold><player></gold> è stato liberato con successo dalla prigione.</green>"
  broadcast: "Il giocatore <gold><player></gold> è stato liberato dalla prigione. State attenti..."

# Messaggi del comando /ban
ban:
  ban: "<green>Hai bannato <gold><player></gold> per <gold><reason></gold> per <gold><time></gold></green> <dark_gray>(ID: <id>)</dark_gray>"
  usage: "Uso corretto: <gold>/ban <nome_giocatore> (tempo) <motivo>"
  kick_message:
    # Puoi personalizzare il messaggio mostrato al giocatore bannato
    - 'Nome del server'
    - 'PunisherX &8» &7Sei stato bannato'
    - '&7'
    - '&7'
    - "&cMotivo &8» &7<reason>"
    - "&cDurata &8» &7<time>"
    - '&7'
    - '&8Puoi fare ricorso su:'
    - "&eDiscord &8» &c&nhttps://tuoserver.it/discord"
  broadcast: "<dark_gray>Il giocatore <gray><player></gray> è stato bannato per <gray><reason></gray> per <gray><time></gray></dark_gray>"
    # In alternativa puoi usare questo formato se vuoi evidenziare di più il messaggio
    # broadcast:
    #- "<dark_gray>*************** Nome del server *************** </dark_gray>"
    #- ""
    #- "<red>   Il giocatore <white><player></white> è stato bannato</red>"
    #- "   Motivo: <white><reason></white>"
    #- "   Durata: <white><time></white>"
    #- ""
  #- "<dark_gray>*************************************************** </dark_gray>"
  no_reasons: "nessun motivo"
  reasons: # Aggiungi motivi personalizzati che saranno suggeriti durante l’esecuzione del comando
    - "Cheat"
    - "Griefing"
    - "Spam"
    - "Linguaggio volgare"

# Messaggi del comando /banip
banip:
  ban: "<green>Hai bannato l’IP del giocatore per <gold><reason></gold> per <gold><time></gold></green> <dark_gray>(ID: <id>)</dark_gray>"
  usage: "Uso corretto: <gold>/banip <giocatore|ip> (tempo) <motivo>"
  kick_message:
    # Puoi personalizzare il messaggio mostrato al giocatore bannato
    - 'Nome del server'
    - 'PunisherX &8» &7Il tuo IP è stato bannato!'
    - '&7'
    - '&7'
    - "&cMotivo &8» &7<reason>"
    - "&cDurata &8» &7<time>"
    - '&7'
    - '&8Puoi fare ricorso su:'
    - "&eDiscord &8» &c&nhttps://SyntaxDevTeam.pl/discord"
  broadcast: "<dark_gray>Il giocatore <gray><player></gray> è stato bannato per <gray><reason></gray> per <gray><time></gray></dark_gray>"
  no_reasons: "nessun motivo"
  reasons:
    - "Multiaccount"
    - "Griefing"
    - "Spam"
    - "Linguaggio volgare"

# Messaggi del comando /unban
unban:
  unban: "<green>Il giocatore <gold><player></gold> è stato sbannato</green>"
  usage: "Uso corretto: <gold>/unban <nome_giocatore>"
  broadcast: "<dark_gray>Il giocatore <gray><player></gray> è stato sbannato</dark_gray>"
# Messaggi del comando /mute
mute:
  mute: "<green>Hai silenziato il giocatore <gold><player></gold> per <gold><reason></gold> per <gold><time></gold></green> <dark_gray>(ID: <id>)</dark_gray>"
  usage: "Uso corretto: <gold>/mute <nome_giocatore> (tempo) <motivo>"
  mute_message: "<red>Sei stato silenziato per <b><reason></b> per <b><time></b></red>"
  mute_info_message: "<red>Stai provando a parlare, ma sei ancora silenziato per <time>.</red>"
  broadcast: "<dark_gray>Il giocatore <gray><player></gray> è stato silenziato per <gray><reason></gray> per <gray><time></gray></dark_gray>"
    # In alternativa puoi usare questo formato se vuoi evidenziare di più il messaggio
    # broadcast:
    #- "<dark_gray>*************** Nome del server *************** </dark_gray>"
