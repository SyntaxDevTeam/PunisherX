# PunisherX Velocity Bridge database configuration
# Set these to point at the same database PunisherX uses so active network bans are visible.\n# The proxy account needs SELECT on punishments only.
host=localhost
port=3306
database=punisherx
username=punisherx_proxy
password=replace_with_your_read_only_password
# Interval in milliseconds for SQL reconciliation for connected players
poll-interval-ms=1000
